version: "3"
services:
  app:
    build:
      context: .
      args:
        RAILS_ENV: development
    user: root
    env_file:
      - docker-compose.env
    volumes:
      - .:/srv/affordable-housing-monitoring:cached
    depends_on:
      - db
    ports:
      - 3000:3000
    networks:
      private:

  db:
    image: postgres@sha256:78481659c47e862334611ccdaf7c369c986b3046da9857112f3b309114a65fb4
    networks:
      private:
    restart: on-failure

networks:
  private:
